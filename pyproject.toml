[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raid"
version = "0.1.0"
description = "RAID Log Manager: review, store and summarise Risks, Assumptions, Issues and Dependencies"
requires-python = ">=3.12"
dependencies = ["jsonschema==4.25.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
raid = "raid.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raid = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
